name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Enable Corepack (for pnpm/yarn)
        run: corepack enable

      - name: Install dependencies (auto-detect)
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            yarn install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          else
            echo "No recognized lockfile; refusing a non-reproducible install." >&2
            exit 1
          fi

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run full gate
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm run gate:full
          elif [ -f yarn.lock ]; then
            yarn run gate:full
          else
            npm run gate:full
          fi

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run visual smoke gate
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm run gate:visual
          elif [ -f yarn.lock ]; then
            yarn gate:visual
          else
            npm run gate:visual
          fi
